[package]
name = "argus-ui"
version = "0.2.1"
edition = "2024"
rust-version = "1.99.1"
description = "A cross-platform Fluent-inspired GPUI Kit component gallery"
repository = "https://github.com/weepwood/Argus-UI"
license = "MIT"
publish = false

[workspace]
members = ["crates/argus-ui-core", "crates/argus-ui-kit"]
default-members = [".", "crates/argus-ui-core", "crates/argus-ui-kit"]
resolver = "3"

[dependencies]
gpui-kit = "=0.8.0"
argus-ui-core = { path = "crates/argus-ui-core" }
argus-ui-kit = { path = "crates/argus-ui-kit" }

# Local copy of the upstream Apache-2.0 Windows backend. The stock 0.3.9
# rasterizes translucent-window text as a single-channel grayscale bitmap;
# the local patch keeps DirectWrite's LCD coverage and folds it by luminance,
# preserving subpixel spatial detail (see vendor/gpui-pre-windows/PATCHES.md).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
