[package]
name = "argus-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "An original Fluent-inspired GPUI Kit desktop starter"
repository = "https://github.com/weepwood/Argus-UI"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "=0.8.0"

# Local copy of the upstream Apache-2.0 Windows backend. The stock 0.3.9
# rasterizes translucent-window text as a single-channel grayscale bitmap;
# the local patch keeps DirectWrite's LCD coverage and folds it by luminance,
# preserving subpixel spatial detail (see vendor/gpui-pre-windows/PATCHES.md).
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
