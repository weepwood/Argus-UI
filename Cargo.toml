[package]
name = "argus-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "An original Fluent-inspired GPUI Kit desktop starter"
repository = "https://github.com/weepwood/Argus-UI"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "=0.8.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
