name: Release

# Release assets: Windows x86_64 portable ZIP + macOS universal DMG only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package/publish (empty: build artifacts only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check manifest version and tag
        id: manifest
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version in Cargo.toml: $version" >&2
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [[ "$REF_TYPE" == "tag" ]]; then tag="$REF_NAME"; fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "Release tag $tag must match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Package Windows x86_64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build and package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package-windows.ps1 -Version $env:VERSION
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/argus-ui-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: Package macOS universal DMG
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build universal app and DMG
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/package-macos.sh "$VERSION"
      - name: Upload DMG only
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/argus-ui-*-macos-universal.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, windows, macos]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Validate exact asset set and produce checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          windows="argus-ui-${VERSION}-windows-x64.zip"
          macos="argus-ui-${VERSION}-macos-universal.dmg"
          test -s "release/$windows"
          test -s "release/$macos"
          actual=$(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=$(printf '%s\n' "$windows" "$macos" | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release assets:" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          fi
          unzip -Z -1 "release/$windows" | grep -Fxq "argus-ui-${VERSION}-windows-x64/ArgusUI.exe"
          (cd release && sha256sum "$windows" "$macos" > SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)
          ls -lh release/
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            # Clean legacy macOS ZIP/sidecars when replacing an older release.
            while IFS= read -r asset; do
              case "$asset" in
                *-macos-*.zip|*-macos-*.sha256)
                  gh release delete-asset "$TAG" "$asset" --yes ;;
              esac
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          else
            gh release create "$TAG" release/* \
              --verify-tag \
              --title "Argus UI v$VERSION" \
              --notes-file CHANGELOG.md
          fi
