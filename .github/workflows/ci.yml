name: Native desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x86_64 checks
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate packaging PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/package-windows.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify committed formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build (Windows x86_64)
        if: github.event_name != 'pull_request'
        run: cargo build -p argus-ui --release --locked --target x86_64-pc-windows-msvc

  macos:
    name: macOS native checks
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate DMG packaging shell syntax
        run: bash -n scripts/package-macos.sh
      - name: Check
        run: cargo check --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build (native only, no standalone artifact)
        if: github.event_name != 'pull_request'
        run: cargo build -p argus-ui --release --locked

  core-portability:
    name: Portable core library (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test std-only core independently
        run: cargo test --locked -p argus-ui-core
      - name: Check core library
        run: cargo check --locked -p argus-ui-core
      - name: Run independent core consumer example
        run: cargo run --locked -p argus-ui-core --example consumer
