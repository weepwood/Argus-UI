name: fmt-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Probe formatting
        shell: bash
        run: |
          set +e
          echo "rustfmt: $(rustfmt --version)"
          out=$(cargo fmt --all -- --check 2>&1)
          code=$?
          esc=$(printf '%s' "$out" | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=fmt-diff::$esc"
          exit $code
